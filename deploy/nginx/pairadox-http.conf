# __DOMAIN__ before it has a certificate: only answers Let's Encrypt's challenge.
# deploy/server-setup.sh swaps in pairadox.conf once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
